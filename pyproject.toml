[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linguaproctor"
version = "0.1.0"
description = "AI-Powered Bilingual Translation Examination & Assessment Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "openai>=1.50.0",
    "azure-cognitiveservices-speech>=1.40.0",
    "azure-storage-blob>=12.22.0",
    "azure-cosmos>=4.7.0",
    "azure-identity>=1.18.0",
    # Transport for the async Azure SDKs (azure.identity.aio, azure.cosmos.aio)
    "aiohttp>=3.10.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b28",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "tiktoken>=0.7.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
dashboard = [
    "streamlit>=1.46.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests requiring Azure credentials",
    "slow: marks slow-running tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Form()/File() defaults are idiomatic.
# UP042: (str, Enum) kept for Pydantic/OpenAPI compatibility.
# E501: long LLM prompt literals are clearer unwrapped.
ignore = ["B008", "UP042", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
